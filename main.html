
<!DOCTYPE html>
<html>
<head>
    <title>Unit Converter</title>
</head>
<body>

    <h2>Unit Conversion Program</h2>

    <label>Enter Value:</label>
    <input type="number" id="value" placeholder="Enter a number">

    <br><br>

    <label>Select Conversion:</label>
    <select id="conversion">
        <option value="1">Fahrenheit to Celsius</option>
        <option value="2">Celsius to Fahrenheit</option>
        <option value="3">Meters to Feet</option>
        <option value="4">Feet to Meters</option>
    </select>

    <br><br>

    <button onclick="convert()">Convert</button>

    <h3 id="result"></h3>

    <script>
        function convert() {

            let value = parseFloat(document.getElementById("value").value);
            let choice = document.getElementById("conversion").value;
            let result;

            if (document.getElementById("value").value === "") {
                document.getElementById("result").innerHTML =
                    "Please enter a value.";
                return;
            }

            switch (choice) {

                case "1":
                    result = (value - 32) * 5 / 9;
                    document.getElementById("result").innerHTML =
                        value + " Fahrenheit = " + result.toFixed(2) + " Celsius";
                    break;

                case "2":
                    result = (value * 9 / 5) + 32;
                    document.getElementById("result").innerHTML =
                        value + " Celsius = " + result.toFixed(2) + " Fahrenheit";
                    break;

                case "3":
                    result = value * 3.28084;
                    document.getElementById("result").innerHTML =
                        value + " Meters = " + result.toFixed(2) + " Feet";
                    break;

                case "4":
                    result = value / 3.28084;
                    document.getElementById("result").innerHTML =
                        value + " Feet = " + result.toFixed(2) + " Meters";
                    break;

                default:
                    document.getElementById("result").innerHTML =
                        "Invalid choice!";
            }
        }
    </script>

</body>
</html>
